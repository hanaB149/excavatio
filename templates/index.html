<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excavatio — Greco-Roman Excavations & Classical Text Identifier</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f5f2eb; color: #2c2416; }
    header { background: #4a3728; color: #f5f2eb; padding: 1.2rem 2rem; display: flex; align-items: center; gap: 0.75rem; }
    header h1 { font-weight: 500; font-size: 1.5rem; letter-spacing: 0.02em; }
    header span { opacity: 0.7; font-size: 0.85rem; }
    nav { background: #e8e0d4; display: flex; border-bottom: 1px solid #d4c9b8; }
    nav button { flex: 1; padding: 0.8rem; border: none; background: transparent; font-size: 0.9rem; font-weight: 500; cursor: pointer; color: #4a3728; transition: 0.2s; font-family: inherit; }
    nav button:hover { background: #ddd3c5; }
    nav button.active { background: #f5f2eb; border-bottom: 2px solid #8b6914; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; }
    #map { height: 70vh; border-radius: 8px; border: 1px solid #d4c9b8; }
    .search-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .search-bar input { flex: 1; padding: 0.6rem 1rem; border: 1px solid #d4c9b8; border-radius: 6px; font-size: 0.9rem; background: white; }
    .search-bar button { padding: 0.6rem 1.2rem; background: #4a3728; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
    .search-bar button:hover { background: #5e4836; }
    .identify-box { max-width: 800px; margin: 0 auto; }
    .identify-box textarea { width: 100%; min-height: 200px; padding: 1rem; border: 1px solid #d4c9b8; border-radius: 8px; font-size: 0.95rem; background: white; resize: vertical; font-family: inherit; }
    .identify-box .actions { display: flex; gap: 0.75rem; margin-top: 0.75rem; flex-wrap: wrap; }
    .identify-box .actions button { padding: 0.6rem 1.5rem; background: #4a3728; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-family: inherit; }
    .identify-box .actions button:hover { background: #5e4836; }
    .identify-box .actions label { padding: 0.6rem 1.5rem; background: #e8e0d4; border: 1px solid #d4c9b8; border-radius: 6px; cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; gap: 0.4rem; }
    .identify-box .actions label:hover { background: #ddd3c5; }
    .result-card { display: none; margin-top: 1.5rem; background: white; border-radius: 8px; padding: 1.5rem; border: 1px solid #d4c9b8; }
    .result-card.visible { display: block; }
    .result-card h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .result-card .meta { color: #666; font-size: 0.85rem; margin-bottom: 0.75rem; }
    .result-card .meta strong { color: #2c2416; }
    .result-card .desc { line-height: 1.6; margin-bottom: 1rem; }
    .result-card .trans { border-top: 1px solid #e8e0d4; padding-top: 1rem; }
    .result-card .trans h3 { font-size: 0.9rem; margin-bottom: 0.5rem; color: #8b6914; }
    .result-card .trans .version { margin-bottom: 0.5rem; }
    .result-card .trans .version .label { font-weight: 600; font-size: 0.8rem; }
    .result-card .trans .version .quote { font-style: italic; color: #555; }
    .no-match { display: none; margin-top: 1.5rem; padding: 1rem; background: #fdf0f0; border: 1px solid #e8b4b4; border-radius: 6px; color: #8b2020; }
    .no-match.visible { display: block; }
    .loading { text-align: center; padding: 2rem; color: #888; display: none; }
    .loading.visible { display: block; }
    .site-popup a { color: #8b6914; text-decoration: none; font-weight: 500; }
    .site-popup a:hover { text-decoration: underline; }
    .marker-count { font-size: 0.8rem; color: #888; margin-top: 0.3rem; }
    #file-input { display: none; }
    @media (max-width: 600px) {
      header { flex-direction: column; text-align: center; padding: 1rem; }
      .search-bar { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <h1>&#x1F3F4;&#x200D;&#x26A7; Excavatio</h1>
  <span>Ancient World Explorer</span>
</header>

<nav>
  <button class="active" data-tab="map-tab">&#x1F5FA; Excavation Map</button>
  <button data-tab="text-tab">&#x1F4DC; Text Identifier</button>
</nav>

<!-- ========= TAB 1: MAP ========= -->
<div id="map-tab" class="tab-content active">
  <div class="container">
    <div class="search-bar">
      <input type="text" id="search-q" value="excavation" placeholder="Search for ancient sites (e.g. excavation, temple, forum, acropolis)">
      <button id="search-btn">Search</button>
    </div>
    <div id="map"></div>
    <div class="marker-count" id="marker-count"></div>
  </div>
</div>

<!-- ========= TAB 2: TEXT IDENTIFIER ========= -->
<div id="text-tab" class="tab-content">
  <div class="container">
    <div class="identify-box">
      <textarea id="text-input" placeholder="Paste a passage from a classical text (Greek or Latin) — for example:&#10;&#10;arma virumque cano&#10;&#10;or:&#10;&#10;ἄνδρα μοι ἔννεπε μοῦσα πολύτροπον"></textarea>
      <div class="actions">
        <button id="identify-btn">Identify Text</button>
        <label for="file-input">&#x1F4F7; Upload Image</label>
        <input type="file" id="file-input" accept="image/*">
      </div>
      <div class="loading" id="loading">Identifying...</div>
      <div class="no-match" id="no-match">No classical text match found. Try a different passage.</div>
      <div class="result-card" id="result-card">
        <h2 id="result-title"></h2>
        <div class="meta">
          <span><strong>Author:</strong> <span id="result-author"></span></span> &middot;
          <span><strong>Work:</strong> <span id="result-work"></span></span> &middot;
          <span id="result-location"></span>
        </div>
        <p class="desc" id="result-desc"></p>
        <div class="trans" id="result-trans"></div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ---- Tab switching ----
  document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'map-tab') setTimeout(() => map.invalidateSize(), 100);
    });
  });

  // ---- Map ----
  const map = L.map('map').setView([38.5, 15.5], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OSM</a>'
  }).addTo(map);

  let markers = [];

  function loadExcavations(query) {
    document.getElementById('marker-count').textContent = 'Loading...';
    markers.forEach(m => map.removeLayer(m));
    markers = [];
    fetch(`/api/excavations?q=${encodeURIComponent(query)}`)
      .then(r => r.json())
      .then(data => {
        document.getElementById('marker-count').textContent = `${data.length} sites found`;
        data.forEach(site => {
          const color = site.featureTypes.includes('amphitheater') ? '#8b2020' : '#4a3728';
          const m = L.circleMarker([site.lat, site.lng], {
            radius: 7, fillColor: color, color: '#f5f2eb', weight: 2, fillOpacity: 0.8
          }).addTo(map);
          m.bindPopup(`
            <div class="site-popup">
              <strong>${site.title}</strong><br>
              ${site.description ? site.description.substring(0, 150) + '...' : ''}<br>
              <a href="${site.uri}" target="_blank">View on Pleiades &rarr;</a>
            </div>
          `);
          markers.push(m);
        });
        if (data.length) {
          const bounds = markers.map(m => m.getLatLng());
          map.fitBounds(bounds, { padding: [30, 30] });
        }
      })
      .catch(() => document.getElementById('marker-count').textContent = 'Error loading data');
  }

  document.getElementById('search-btn').addEventListener('click', () => {
    loadExcavations(document.getElementById('search-q').value || 'excavation');
  });
  document.getElementById('search-q').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('search-btn').click();
  });

  loadExcavations('excavation');

  // ---- Text Identifier ----
  const identifyBtn = document.getElementById('identify-btn');
  const textInput = document.getElementById('text-input');
  const loading = document.getElementById('loading');
  const noMatch = document.getElementById('no-match');
  const resultCard = document.getElementById('result-card');

  function identifyText(text) {
    if (!text.trim()) return;
    loading.classList.add('visible');
    noMatch.classList.remove('visible');
    resultCard.classList.remove('visible');
    fetch('/api/identify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    })
      .then(r => r.json())
      .then(data => {
        loading.classList.remove('visible');
        if (!data.matched) {
          noMatch.classList.add('visible');
          return;
        }
        document.getElementById('result-title').textContent = `"${data.text}"`;
        document.getElementById('result-author').textContent = data.author;
        document.getElementById('result-work').textContent = data.work;
        const loc = [];
        if (data.book) loc.push(`Book ${data.book}`);
        if (data.section) loc.push(`Section ${data.section}`);
        if (data.line) loc.push(`Line ${data.line}`);
        document.getElementById('result-location').innerHTML = `<strong>Location:</strong> ${loc.join(', ') || 'N/A'}`;
        document.getElementById('result-desc').textContent = data.description;
        const transDiv = document.getElementById('result-trans');
        transDiv.innerHTML = '<h3>&#x1F30D; Translations & Editions</h3>';
        if (data.translations) {
          Object.entries(data.translations).forEach(([edition, quote]) => {
            const v = document.createElement('div');
            v.className = 'version';
            v.innerHTML = `<span class="label">${edition}</span><br><span class="quote">"${quote}"</span>`;
            transDiv.appendChild(v);
          });
        }
        resultCard.classList.add('visible');
      })
      .catch(() => {
        loading.classList.remove('visible');
        noMatch.classList.add('visible');
      });
  }

  identifyBtn.addEventListener('click', () => identifyText(textInput.value));

  // OCR via Tesseract.js (loaded from CDN if user uploads image)
  document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const imgData = ev.target.result;
      loading.classList.add('visible');
      // Dynamically load Tesseract
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      script.onload = function() {
        Tesseract.recognize(imgData, 'eng+lat+grc', {
          logger: m => { if (m.status === 'recognizing text') loading.textContent = `OCR: ${Math.round(m.progress * 100)}%`; }
        }).then(({ data: { text } }) => {
          loading.textContent = 'Identifying...';
          loading.classList.remove('visible');
          textInput.value = text;
          identifyText(text);
        }).catch(() => {
          loading.textContent = 'Identifying...';
          loading.classList.remove('visible');
          noMatch.classList.add('visible');
        });
      };
      script.onerror = function() {
        loading.classList.remove('visible');
        alert('Failed to load OCR engine. Check internet connection.');
      };
      document.head.appendChild(script);
    };
    reader.readAsDataURL(file);
  });
</script>
</body>
</html>
