<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excavatio — Ancient World Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    @keyframes floatOuter {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(2deg); }
      75% { transform: translateY(-2px) rotate(-1deg); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.08); }
      60% { transform: scale(1); }
    }
    @keyframes ripples {
      0% { box-shadow: 0 0 0 0 rgba(244, 143, 177, 0.35), 0 0 0 0 rgba(244, 143, 177, 0.2); }
      100% { box-shadow: 0 0 0 16px rgba(244, 143, 177, 0), 0 0 0 32px rgba(244, 143, 177, 0); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popBounce {
      0% { opacity: 0; transform: scale(0.7); }
      55% { transform: scale(1.08); }
      80% { transform: scale(0.97); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes slideInStagger {
      from { opacity: 0; transform: translateX(-20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes breathePink {
      0%, 100% { box-shadow: 0 0 20px rgba(244, 143, 177, 0.15); }
      50% { box-shadow: 0 0 40px rgba(244, 143, 177, 0.3); }
    }
    @keyframes shimmerPastel {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes dotPulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #fef6f8 0%, #fce4ec 30%, #fef0f6 60%, #fde8ef 100%);
      background-size: 400% 400%;
      animation: shimmerPastel 12s ease infinite;
      color: #5c3349;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(circle at 15% 30%, rgba(244,143,177,0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(206,147,216,0.06) 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(248,187,208,0.07) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .floating-heart {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(244,143,177,0.35);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      animation: floatOuter 5s ease-in-out infinite;
    }
    .floating-heart::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 0;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(244,143,177,0.15);
    }
    .floating-heart::after {
      content: '';
      position: absolute;
      top: 0;
      left: -8px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(244,143,177,0.15);
    }
    .floating-heart:nth-child(1) { top: 8%; left: 4%; animation-delay: 0s; }
    .floating-heart:nth-child(2) { top: 22%; right: 6%; animation-delay: 1.2s; width: 14px; height: 14px; }
    .floating-heart:nth-child(3) { bottom: 18%; left: 8%; animation-delay: 2.4s; width: 15px; height: 15px; }
    .floating-heart:nth-child(4) { bottom: 30%; right: 4%; animation-delay: 0.8s; width: 12px; height: 12px; }
    .floating-heart:nth-child(5) { top: 45%; left: 2%; animation-delay: 1.8s; width: 10px; height: 10px; }

    header {
      background: linear-gradient(135deg, #f8bbd0, #f0b6d0, #e8b6d6, #f0b6d0, #f8bbd0);
      background-size: 300% 300%;
      animation: shimmerPastel 8s ease infinite;
      color: #fff;
      padding: 1.3rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      position: relative;
      z-index: 1;
      box-shadow: 0 4px 24px rgba(244, 143, 177, 0.2);
    }
    header .heart-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      animation: heartbeat 2.5s ease-in-out infinite;
    }
    header .heart-icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #fff;
      stroke-width: 2.2;
    }
    header h1 {
      font-weight: 800;
      font-size: 1.55rem;
      letter-spacing: 0.03em;
      text-shadow: 0 2px 10px rgba(0,0,0,0.06);
    }
    header span {
      opacity: 0.88;
      font-size: 0.85rem;
      font-weight: 400;
    }

    nav {
      background: rgba(255,255,255,0.65);
      backdrop-filter: blur(14px);
      display: flex;
      border-bottom: 1px solid rgba(244, 143, 177, 0.18);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    nav button {
      flex: 1;
      padding: 0.9rem;
      border: none;
      background: transparent;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: #7a4a6a;
      transition: all 0.3s ease;
      font-family: inherit;
      position: relative;
    }
    nav button:hover {
      background: rgba(244, 143, 177, 0.08);
      color: #d45a8a;
    }
    nav button.active {
      background: rgba(255,255,255,0.8);
      color: #c94f7c;
    }
    nav button.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 20%;
      width: 60%;
      height: 3px;
      background: linear-gradient(90deg, #f48fb1, #f0a0c0, #ce93d8);
      border-radius: 3px 3px 0 0;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
      position: relative;
      z-index: 1;
    }

    .map-section { display: flex; flex-direction: column; gap: 1rem; }

    #map {
      height: 54vh;
      border-radius: 18px;
      border: 2px solid rgba(244, 143, 177, 0.25);
      box-shadow: 0 8px 36px rgba(244, 143, 177, 0.12);
      animation: breathePink 5s ease-in-out infinite;
    }

    .timeline-bar {
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 1.1rem 1.5rem;
      border: 2px solid rgba(244, 143, 177, 0.18);
      box-shadow: 0 4px 20px rgba(244, 143, 177, 0.08);
      transition: box-shadow 0.3s;
    }
    .timeline-bar:hover { box-shadow: 0 6px 28px rgba(244, 143, 177, 0.14); }

    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .timeline-header .label {
      font-weight: 700;
      font-size: 0.85rem;
      color: #7a4a6a;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .timeline-header .label svg {
      width: 16px;
      height: 16px;
      stroke: #d48aa8;
      fill: none;
      stroke-width: 2;
    }
    .timeline-header .year-display {
      font-weight: 800;
      font-size: 1rem;
      color: #c94f7c;
      background: rgba(244, 143, 177, 0.1);
      padding: 0.2rem 0.9rem;
      border-radius: 50px;
      border: 1.5px solid rgba(244, 143, 177, 0.2);
    }

    .timeline-track {
      position: relative;
      height: 32px;
      margin: 0.2rem 0 0.4rem;
    }
    .timeline-rail {
      position: absolute;
      top: 50%;
      left: 0; right: 0;
      height: 4px;
      background: rgba(244, 143, 177, 0.15);
      border-radius: 4px;
      transform: translateY(-50%);
    }
    .timeline-fill {
      position: absolute;
      top: 50%;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #f48fb1, #f0a0c0, #ce93d8);
      border-radius: 4px;
      transform: translateY(-50%);
      transition: width 0.25s ease;
      width: 0%;
    }
    .timeline-handle {
      position: absolute;
      top: 50%;
      width: 22px;
      height: 22px;
      background: linear-gradient(135deg, #f48fb1, #ce93d8);
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 2px 10px rgba(244, 143, 177, 0.35);
      transform: translate(-50%, -50%);
      cursor: grab;
      z-index: 2;
      transition: box-shadow 0.2s, transform 0.15s;
    }
    .timeline-handle:hover {
      box-shadow: 0 2px 16px rgba(244, 143, 177, 0.5);
      transform: translate(-50%, -50%) scale(1.08);
    }
    .timeline-handle:active { cursor: grabbing; transform: translate(-50%, -50%) scale(0.95); }
    .timeline-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #9a7a8a;
      font-weight: 600;
    }

    .timeline-filters {
      display: flex;
      gap: 0.45rem;
      margin-top: 0.6rem;
      flex-wrap: wrap;
    }
    .filter-chip {
      padding: 0.3rem 0.95rem;
      border-radius: 50px;
      border: 1.5px solid rgba(244, 143, 177, 0.22);
      background: transparent;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: 'Nunito', sans-serif;
      color: #7a4a6a;
      position: relative;
    }
    .filter-chip:hover { border-color: #f48fb1; background: rgba(244, 143, 177, 0.06); transform: translateY(-1px); }
    .filter-chip.active {
      background: linear-gradient(135deg, #f48fb1, #ce93d8);
      color: white;
      border-color: transparent;
      box-shadow: 0 2px 10px rgba(244, 143, 177, 0.25);
    }
    .filter-chip .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-right: 0.3rem;
      vertical-align: middle;
    }
    .filter-chip .dot.green { background: #81c784; }
    .filter-chip .dot.grey { background: #bdbdbd; }

    .site-list {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding: 0.4rem 0 0.2rem;
      scrollbar-width: thin;
      scrollbar-color: #f48fb1 transparent;
    }
    .site-list::-webkit-scrollbar { height: 4px; }
    .site-list::-webkit-scrollbar-thumb { background: #f48fb1; border-radius: 4px; background-clip: content-box; }

    .site-chip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.85rem;
      border-radius: 50px;
      background: rgba(255,255,255,0.7);
      border: 1.5px solid rgba(244, 143, 177, 0.18);
      font-size: 0.77rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: 'Nunito', sans-serif;
      color: #4a2c3a;
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }
    .site-chip:hover {
      border-color: #f48fb1;
      background: rgba(255,255,255,0.9);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(244, 143, 177, 0.12);
    }
    .site-chip.active {
      background: linear-gradient(135deg, #f48fb1, #ce93d8);
      color: white;
      border-color: transparent;
      box-shadow: 0 2px 10px rgba(244, 143, 177, 0.2);
    }
    .site-chip .chip-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .site-chip .chip-dot.ongoing { background: #81c784; }
    .site-chip .chip-dot.completed { background: #bdbdbd; }

    .site-panel {
      display: none;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 1.3rem 1.5rem;
      border: 2px solid rgba(244, 143, 177, 0.18);
      box-shadow: 0 4px 20px rgba(244, 143, 177, 0.08);
      transition: all 0.3s;
    }
    .site-panel.visible { display: block; }
    .site-panel h3 { font-size: 1.1rem; margin-bottom: 0.25rem; color: #c94f7c; }
    .site-panel .period { font-size: 0.8rem; color: #9a7a8a; margin-bottom: 0.5rem; }
    .site-panel .desc { font-size: 0.9rem; line-height: 1.65; color: #5a3c4a; }
    .site-panel .meta-row { display: flex; gap: 1rem; margin-top: 0.5rem; font-size: 0.8rem; align-items: center; }
    .site-panel .meta-row .pill {
      padding: 0.2rem 0.7rem; border-radius: 50px; font-weight: 700; font-size: 0.72rem;
    }
    .pill.ongoing { background: #c8e6c9; color: #2e7d32; }
    .pill.completed { background: #e0e0e0; color: #616161; }

    .marker-count {
      font-size: 0.8rem;
      color: #9a7a8a;
      font-weight: 600;
      text-align: center;
      padding: 0.2rem 0;
    }

    .identify-box { max-width: 800px; margin: 0 auto; }
    .identify-box textarea {
      width: 100%; min-height: 200px; padding: 1.2rem;
      border: 2px solid rgba(244, 143, 177, 0.2);
      border-radius: 18px;
      font-size: 0.95rem;
      background: rgba(255,255,255,0.8);
      resize: vertical;
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      color: #4a2c3a;
      transition: all 0.3s ease;
    }
    .identify-box textarea:focus {
      outline: none;
      border-color: #f48fb1;
      box-shadow: 0 0 0 5px rgba(244, 143, 177, 0.1);
      background: white;
    }
    .identify-box .actions { display: flex; gap: 0.7rem; margin-top: 0.75rem; flex-wrap: wrap; }
    .identify-box .actions button, .identify-box .actions label {
      padding: 0.7rem 1.8rem;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 700;
      font-family: 'Nunito', sans-serif;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    .identify-box .actions button {
      background: linear-gradient(135deg, #f48fb1, #ce93d8);
      color: white;
      border: none;
      box-shadow: 0 4px 14px rgba(244, 143, 177, 0.25);
    }
    .identify-box .actions button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(244, 143, 177, 0.35);
    }
    .identify-box .actions button:active { transform: translateY(0); }
    .identify-box .actions label {
      background: rgba(255,255,255,0.75);
      border: 2px solid rgba(244, 143, 177, 0.2);
      color: #7a4a6a;
    }
    .identify-box .actions label:hover {
      background: white;
      border-color: #f48fb1;
      transform: translateY(-2px);
    }

    .result-card {
      display: none;
      margin-top: 1.5rem;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      padding: 1.8rem;
      border: 2px solid rgba(244, 143, 177, 0.18);
      box-shadow: 0 8px 36px rgba(244, 143, 177, 0.08);
    }
    .result-card.visible { display: block; }
    .result-card h2 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      color: #c94f7c;
      font-family: 'Playfair Display', serif;
      font-style: italic;
    }
    .result-card .meta { color: #9a7a8a; font-size: 0.85rem; margin-bottom: 0.75rem; }
    .result-card .meta strong { color: #4a2c3a; }
    .result-card .desc { line-height: 1.7; margin-bottom: 1rem; color: #5a3c4a; }
    .result-card .trans { border-top: 2px dashed rgba(244, 143, 177, 0.25); padding-top: 1rem; }
    .result-card .trans h3 { font-size: 0.9rem; margin-bottom: 0.8rem; color: #ce93d8; font-weight: 800; }
    .result-card .trans .version {
      margin-bottom: 0.6rem;
      padding: 0.6rem 0.9rem;
      background: rgba(248, 187, 208, 0.08);
      border-radius: 12px;
      border: 1px solid rgba(244, 143, 177, 0.08);
    }
    .result-card .trans .version:last-child { margin-bottom: 0; }
    .result-card .trans .version .label { font-weight: 700; font-size: 0.8rem; color: #7a4a6a; }
    .result-card .trans .version .quote { font-style: italic; color: #6a4a5a; font-family: 'Playfair Display', serif; font-size: 0.95rem; }

    .no-match {
      display: none; margin-top: 1.5rem;
      padding: 1.2rem;
      background: rgba(255, 205, 210, 0.5);
      border: 2px solid #ef9a9a;
      border-radius: 16px;
      color: #b35a5a;
      text-align: center;
      font-weight: 600;
    }
    .no-match.visible { display: block; }
    .loading {
      text-align: center;
      padding: 2rem;
      color: #ce93d8;
      font-weight: 700;
      display: none;
    }
    .loading.visible { display: block; }

    #file-input { display: none; }

    .popup-site strong { color: #c94f7c; }
    .popup-site .popup-status {
      display: inline-block;
      padding: 0.1rem 0.5rem;
      border-radius: 50px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-top: 0.3rem;
    }
    .popup-site .popup-status.ongoing { background: #c8e6c9; color: #2e7d32; }
    .popup-site .popup-status.completed { background: #e0e0e0; color: #616161; }

    @media (max-width: 600px) {
      header { flex-direction: column; text-align: center; padding: 1rem; }
      .timeline-labels { font-size: 0.6rem; }
      .filter-chip { font-size: 0.7rem; padding: 0.25rem 0.7rem; }
    }
  </style>
</head>
<body>

<div class="floating-heart"></div>
<div class="floating-heart"></div>
<div class="floating-heart"></div>
<div class="floating-heart"></div>
<div class="floating-heart"></div>

<header>
  <span class="heart-icon">
    <svg viewBox="0 0 24 24">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </span>
  <h1>Excavatio</h1>
  <span>ancient world explorer</span>
</header>

<nav>
  <button class="active" data-tab="map-tab">excavation map</button>
  <button data-tab="text-tab">text identifier</button>
</nav>

<div id="map-tab" class="tab-content active">
  <div class="container">
    <div class="map-section">

      <div class="timeline-bar">
        <div class="timeline-header">
          <span class="label">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
            excavation timeline
          </span>
          <span class="year-display" id="year-display">all years</span>
        </div>
        <div class="timeline-track" id="timeline-track">
          <div class="timeline-rail"></div>
          <div class="timeline-fill" id="timeline-fill"></div>
          <div class="timeline-handle" id="timeline-handle"></div>
        </div>
        <div class="timeline-labels">
          <span id="timeline-min">1700</span>
          <span id="timeline-max">2026</span>
        </div>
        <div class="timeline-filters">
          <button class="filter-chip active" data-filter="all">all</button>
          <button class="filter-chip" data-filter="ongoing"><span class="dot green"></span>ongoing</button>
          <button class="filter-chip" data-filter="completed"><span class="dot grey"></span>completed</button>
          <button class="filter-chip" data-filter="ancient">ancient</button>
          <button class="filter-chip" data-filter="modern">modern</button>
        </div>
      </div>

      <div id="map"></div>

      <div class="site-list" id="site-list"></div>

      <div class="site-panel" id="site-panel">
        <h3 id="panel-title"></h3>
        <div class="period" id="panel-period"></div>
        <p class="desc" id="panel-desc"></p>
        <div class="meta-row">
          <span class="pill" id="panel-status"></span>
          <span id="panel-years"></span>
        </div>
      </div>

      <div class="marker-count" id="marker-count"></div>
    </div>
  </div>
</div>

<div id="text-tab" class="tab-content">
  <div class="container">
    <div class="identify-box">
      <textarea id="text-input" placeholder="paste a passage from a classical text...&#10;&#10;arma virumque cano&#10;&#10;&#xE1;&#xBD;&#x84;&#xBD;&#x03B4;&#x03C1;&#x03B1; &#x03BC;&#x03BF;&#x03B9; &#x1F14;&#x03BD;&#x03BD;&#x03B5;&#x03C0;&#x03B5; &#x03BC;&#x03BF;&#x1FE6;&#x03C3;&#x03B1; &#x03C0;&#x03BF;&#x03BB;&#x03CD;&#x03C4;&#x03C1;&#x03BF;&#x03C0;&#x03BF;&#x03BD;"></textarea>
      <div class="actions">
        <button id="identify-btn">identify text</button>
        <label for="file-input">upload image</label>
        <input type="file" id="file-input" accept="image/*">
      </div>
      <div class="loading" id="loading">identifying</div>
      <div class="no-match" id="no-match">no match found -- try a different passage</div>
      <div class="result-card" id="result-card">
        <h2 id="result-title"></h2>
        <div class="meta">
          <span><strong>author:</strong> <span id="result-author"></span></span> &middot;
          <span><strong>work:</strong> <span id="result-work"></span></span> &middot;
          <span id="result-location"></span>
        </div>
        <p class="desc" id="result-desc"></p>
        <div class="trans">
          <h3>translations & editions</h3>
          <div id="result-trans"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  let allSites = [];
  let mapMarkers = {};
  let currentFilter = 'all';

  const map = L.map('map').setView([38.5, 15.5], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OSM</a>'
  }).addTo(map);

  function loadSites() {
    const params = new URLSearchParams();
    if (currentFilter === 'ongoing') params.set('status', 'ongoing');
    else if (currentFilter === 'completed') params.set('status', 'completed');
    else if (['ancient','modern'].includes(currentFilter)) params.set('era', currentFilter);
    fetch(`/api/excavations?${params}`)
      .then(r => r.json())
      .then(data => {
        allSites = data.sites;
        renderTimeline(data.yearMin, data.yearMax);
        renderSites();
      });
  }

  function renderTimeline(yearMin, yearMax) {
    document.getElementById('timeline-min').textContent = yearMin;
    document.getElementById('timeline-max').textContent = yearMax;
    const track = document.getElementById('timeline-track');
    const handle = document.getElementById('timeline-handle');
    const fill = document.getElementById('timeline-fill');

    function posToYear(frac) {
      return Math.round(yearMin + frac * (yearMax - yearMin));
    }

    function updateFromMouse(clientX) {
      const rect = track.getBoundingClientRect();
      let frac = (clientX - rect.left) / rect.width;
      frac = Math.max(0, Math.min(1, frac));
      handle.style.left = `${frac * 100}%`;
      fill.style.width = `${frac * 100}%`;
      const year = posToYear(frac);
      document.getElementById('year-display').textContent = year >= new Date().getFullYear() ? 'present' : year;
      filterByYear(year);
    }

    function onDrag(e) {
      e.preventDefault();
      const moveHandler = (ev) => { ev.preventDefault(); updateFromMouse(ev.clientX); };
      const upHandler = () => {
        document.removeEventListener('mousemove', moveHandler);
        document.removeEventListener('mouseup', upHandler);
      };
      document.addEventListener('mousemove', moveHandler);
      document.addEventListener('mouseup', upHandler);
    }

    handle.addEventListener('mousedown', onDrag);
    track.addEventListener('mousedown', (e) => {
      if (e.target === handle) return;
      updateFromMouse(e.clientX);
    });

    updateFromMouse(track.getBoundingClientRect().left + track.getBoundingClientRect().width);
  }

  function filterByYear(year) {
    const siteEls = document.querySelectorAll('.site-chip');
    const hidden = [];
    siteEls.forEach(el => {
      const sy = parseFloat(el.dataset.start);
      const ey = el.dataset.end ? parseFloat(el.dataset.end) : 9999;
      const visible = sy <= year;
      el.style.display = visible ? '' : 'none';
      if (!visible) hidden.push(el.dataset.id);
    });
    Object.entries(mapMarkers).forEach(([id, m]) => {
      if (hidden.includes(id)) {
        map.removeLayer(m.layer);
      } else if (!map.hasLayer(m.layer)) {
        m.layer.addTo(map);
      }
    });
  }

  function renderSites() {
    const list = document.getElementById('site-list');
    list.innerHTML = '';
    Object.values(mapMarkers).forEach(m => map.removeLayer(m.layer));
    mapMarkers = {};

    allSites.forEach((site, i) => {
      const chip = document.createElement('div');
      chip.className = 'site-chip';
      chip.dataset.id = site.id;
      chip.dataset.start = site.startYear;
      chip.dataset.end = site.endYear || 9999;
      const dot = document.createElement('span');
      dot.className = `chip-dot ${site.ongoing ? 'ongoing' : 'completed'}`;
      chip.appendChild(dot);
      chip.appendChild(document.createTextNode(site.title));
      chip.addEventListener('click', () => selectSite(site.id));
      list.appendChild(chip);

      setTimeout(() => {
        const marker = L.circleMarker([site.lat, site.lng], {
          radius: 8,
          fillColor: site.ongoing ? '#81c784' : '#ce93d8',
          color: '#fff',
          weight: 2.5,
          fillOpacity: 0.9
        }).addTo(map);

        marker.bindPopup(`
          <div class="popup-site">
            <strong>${site.title}</strong><br>
            <span style="font-size:0.8rem;color:#9a7a8a;">${site.period}</span><br>
            <span class="popup-status ${site.ongoing ? 'ongoing' : 'completed'}">${site.ongoing ? 'ongoing' : 'completed'}</span><br>
            <span style="font-size:0.75rem;color:#aaa;">excavation: ${site.startYear}${site.endYear ? '&ndash;'+site.endYear : '&ndash;present'}</span>
          </div>
        `);

        marker.on('click', () => selectSite(site.id));
        mapMarkers[site.id] = { layer: marker, data: site };
      }, i * 25);
    });

    document.getElementById('marker-count').textContent = allSites.length + ' sites';
  }

  function selectSite(id) {
    document.querySelectorAll('.site-chip').forEach(el => el.classList.toggle('active', el.dataset.id === id));
    const site = mapMarkers[id]?.data;
    if (!site) return;

    const panel = document.getElementById('site-panel');
    document.getElementById('panel-title').textContent = site.title;
    document.getElementById('panel-period').textContent = site.period;
    document.getElementById('panel-desc').textContent = site.description;
    document.getElementById('panel-status').textContent = site.ongoing ? 'ongoing' : 'completed';
    document.getElementById('panel-status').className = `pill ${site.ongoing ? 'ongoing' : 'completed'}`;
    const years = site.endYear ? site.startYear + '&ndash;' + site.endYear : site.startYear + '&ndash;present';
    document.getElementById('panel-years').innerHTML = 'excavation: ' + years;
    panel.classList.add('visible');

    map.setView([site.lat, site.lng], 6, { animate: true });

    Object.entries(mapMarkers).forEach(([mid, m]) => {
      m.layer.setStyle({
        radius: mid === id ? 12 : 8,
        fillOpacity: mid === id ? 1 : 0.9,
        fillColor: mid === id ? '#f48fb1' : (m.data.ongoing ? '#81c784' : '#ce93d8')
      });
    });
  }

  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      document.getElementById('site-panel').classList.remove('visible');
      loadSites();
    });
  });

  document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'map-tab') setTimeout(() => map.invalidateSize(), 100);
    });
  });

  loadSites();

  const identifyBtn = document.getElementById('identify-btn');
  const textInput = document.getElementById('text-input');
  const loading = document.getElementById('loading');
  const noMatch = document.getElementById('no-match');
  const resultCard = document.getElementById('result-card');

  function identifyText(text) {
    if (!text.trim()) return;
    loading.classList.add('visible');
    noMatch.classList.remove('visible');
    resultCard.classList.remove('visible');
    fetch('/api/identify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    })
      .then(r => r.json())
      .then(data => {
        loading.classList.remove('visible');
        if (!data.matched) { noMatch.classList.add('visible'); return; }
        document.getElementById('result-title').textContent = '"' + data.text + '"';
        document.getElementById('result-author').textContent = data.author;
        document.getElementById('result-work').textContent = data.work;
        const loc = [];
        if (data.book) loc.push('book ' + data.book);
        if (data.section) loc.push('section ' + data.section);
        if (data.line) loc.push('line ' + data.line);
        document.getElementById('result-location').innerHTML = '<strong>location:</strong> ' + (loc.join(', ') || 'n/a');
        document.getElementById('result-desc').textContent = data.description;
        const transDiv = document.getElementById('result-trans');
        transDiv.innerHTML = '';
        if (data.translations) {
          Object.entries(data.translations).forEach(([edition, quote]) => {
            const v = document.createElement('div');
            v.className = 'version';
            v.innerHTML = '<span class="label">' + edition + '</span><br><span class="quote">"' + quote + '"</span>';
            transDiv.appendChild(v);
          });
        }
        resultCard.classList.add('visible');
      })
      .catch(() => { loading.classList.remove('visible'); noMatch.classList.add('visible'); });
  }

  identifyBtn.addEventListener('click', () => identifyText(textInput.value));
  textInput.addEventListener('keydown', e => { if (e.key === 'Enter' && e.ctrlKey) identifyText(textInput.value); });

  document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const imgData = ev.target.result;
      loading.classList.add('visible');
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      script.onload = function() {
        Tesseract.recognize(imgData, 'eng+lat+grc', {
          logger: m => { if (m.status === 'recognizing text') loading.textContent = 'ocr: ' + Math.round(m.progress * 100) + '%'; }
        }).then(({ data: { text } }) => {
          loading.textContent = 'identifying';
          loading.classList.remove('visible');
          textInput.value = text;
          identifyText(text);
        }).catch(() => {
          loading.textContent = 'identifying'; loading.classList.remove('visible'); noMatch.classList.add('visible');
        });
      };
      script.onerror = function() { loading.classList.remove('visible'); alert('Failed to load OCR engine.'); };
      document.head.appendChild(script);
    };
    reader.readAsDataURL(file);
  });
</script>
</body>
</html>
