<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excavatio — Ancient World Explorer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
      50% { opacity: 1; transform: scale(1) rotate(180deg); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeSlideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.8); }
      70% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-16px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, #fff5f7 0%, #fce4ec 30%, #f8e8ff 70%, #fce4ec 100%);
      color: #4a2c3a;
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(circle at 20% 50%, rgba(255,182,193,0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(200,160,255,0.12) 0%, transparent 50%),
                        radial-gradient(circle at 50% 80%, rgba(255,218,185,0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }
    header {
      background: linear-gradient(135deg, #f8bbd0, #e1bee7, #f8bbd0);
      background-size: 200% 200%;
      animation: shimmer 6s ease infinite;
      color: #fff;
      padding: 1.4rem 2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      position: relative;
      z-index: 1;
      box-shadow: 0 4px 20px rgba(244, 143, 177, 0.25);
    }
    header h1 { font-weight: 800; font-size: 1.6rem; letter-spacing: 0.03em; text-shadow: 0 2px 8px rgba(0,0,0,0.08); animation: float 4s ease-in-out infinite; }
    header span { opacity: 0.9; font-size: 0.85rem; font-weight: 400; }
    header .heart { font-size: 1.3rem; animation: float 3s ease-in-out infinite 0.5s; }
    nav {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px);
      display: flex;
      border-bottom: 1px solid rgba(244, 143, 177, 0.2);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    nav button {
      flex: 1; padding: 0.9rem; border: none; background: transparent;
      font-size: 0.95rem; font-weight: 700; cursor: pointer; color: #7a4a6a;
      transition: all 0.3s ease; font-family: inherit; position: relative;
    }
    nav button:hover { background: rgba(244, 143, 177, 0.1); color: #d45a8a; }
    nav button.active { background: rgba(255,255,255,0.8); color: #c94f7c; }
    nav button.active::after {
      content: ''; position: absolute; bottom: 0; left: 25%; width: 50%; height: 3px;
      background: linear-gradient(90deg, #f48fb1, #ce93d8); border-radius: 3px 3px 0 0;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .container { max-width: 1400px; margin: 0 auto; padding: 1.5rem; position: relative; z-index: 1; }

    .map-section { display: flex; flex-direction: column; gap: 1rem; }
    #map { height: 55vh; border-radius: 16px; border: 2px solid rgba(244, 143, 177, 0.3); box-shadow: 0 8px 32px rgba(244, 143, 177, 0.15); }

    .timeline-bar {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 1.2rem 1.5rem;
      border: 2px solid rgba(244, 143, 177, 0.2);
      box-shadow: 0 4px 16px rgba(244, 143, 177, 0.1);
      position: relative;
    }
    .timeline-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .timeline-header .label {
      font-weight: 700;
      font-size: 0.85rem;
      color: #7a4a6a;
    }
    .timeline-header .year-display {
      font-weight: 800;
      font-size: 1rem;
      color: #c94f7c;
      background: rgba(244, 143, 177, 0.12);
      padding: 0.2rem 0.8rem;
      border-radius: 50px;
    }
    .timeline-track {
      position: relative;
      height: 32px;
      margin: 0.3rem 0 0.5rem;
    }
    .timeline-rail {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(244, 143, 177, 0.2);
      border-radius: 4px;
      transform: translateY(-50%);
    }
    .timeline-fill {
      position: absolute;
      top: 50%;
      left: 0;
      height: 4px;
      background: linear-gradient(90deg, #f48fb1, #ce93d8);
      border-radius: 4px;
      transform: translateY(-50%);
      transition: width 0.3s ease;
      width: 0%;
    }
    .timeline-handle {
      position: absolute;
      top: 50%;
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #f48fb1, #ce93d8);
      border: 3px solid white;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(244, 143, 177, 0.4);
      transform: translate(-50%, -50%);
      cursor: grab;
      z-index: 2;
      transition: box-shadow 0.2s;
    }
    .timeline-handle:hover { box-shadow: 0 2px 12px rgba(244, 143, 177, 0.6); }
    .timeline-handle:active { cursor: grabbing; }
    .timeline-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.7rem;
      color: #9a7a8a;
      font-weight: 600;
    }
    .timeline-filters {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.6rem;
      flex-wrap: wrap;
    }
    .filter-chip {
      padding: 0.3rem 0.9rem;
      border-radius: 50px;
      border: 2px solid rgba(244, 143, 177, 0.25);
      background: transparent;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Nunito', sans-serif;
      color: #7a4a6a;
    }
    .filter-chip:hover { border-color: #f48fb1; background: rgba(244, 143, 177, 0.08); }
    .filter-chip.active { background: linear-gradient(135deg, #f48fb1, #ce93d8); color: white; border-color: transparent; }

    .site-list {
      display: flex;
      gap: 0.6rem;
      overflow-x: auto;
      padding: 0.5rem 0 0.3rem;
      scrollbar-width: thin;
      scrollbar-color: #f48fb1 transparent;
    }
    .site-list::-webkit-scrollbar { height: 4px; }
    .site-list::-webkit-scrollbar-thumb { background: #f48fb1; border-radius: 4px; }

    .site-chip {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.9rem;
      border-radius: 50px;
      background: white;
      border: 2px solid rgba(244, 143, 177, 0.2);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Nunito', sans-serif;
      color: #4a2c3a;
      white-space: nowrap;
    }
    .site-chip:hover { border-color: #f48fb1; transform: translateY(-1px); box-shadow: 0 2px 8px rgba(244, 143, 177, 0.15); }
    .site-chip.active { background: linear-gradient(135deg, #f48fb1, #ce93d8); color: white; border-color: transparent; }
    .site-chip .dot {
      width: 8px; height: 8px; border-radius: 50%;
      flex-shrink: 0;
    }
    .site-chip .dot.ongoing { background: #66bb6a; }
    .site-chip .dot.completed { background: #9e9e9e; }

    .site-panel {
      display: none;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 1.2rem 1.5rem;
      border: 2px solid rgba(244, 143, 177, 0.2);
      box-shadow: 0 4px 16px rgba(244, 143, 177, 0.1);
    }
    .site-panel.visible { display: block; }
    .site-panel h3 { font-size: 1.1rem; margin-bottom: 0.3rem; color: #c94f7c; }
    .site-panel .period { font-size: 0.8rem; color: #9a7a8a; margin-bottom: 0.5rem; }
    .site-panel .desc { font-size: 0.9rem; line-height: 1.6; color: #5a3c4a; }
    .site-panel .meta-row { display: flex; gap: 1rem; margin-top: 0.5rem; font-size: 0.8rem; }
    .site-panel .meta-row .pill {
      padding: 0.2rem 0.7rem; border-radius: 50px; font-weight: 700; font-size: 0.72rem;
    }
    .pill.ongoing { background: #c8e6c9; color: #2e7d32; }
    .pill.completed { background: #e0e0e0; color: #616161; }

    .identify-box { max-width: 800px; margin: 0 auto; }
    .identify-box textarea {
      width: 100%; min-height: 200px; padding: 1.2rem;
      border: 2px solid rgba(244, 143, 177, 0.25); border-radius: 16px;
      font-size: 0.95rem; background: rgba(255,255,255,0.85);
      resize: vertical; font-family: 'Nunito', sans-serif; font-weight: 600; color: #4a2c3a;
      transition: all 0.3s ease;
    }
    .identify-box textarea:focus { outline: none; border-color: #f48fb1; box-shadow: 0 0 0 4px rgba(244, 143, 177, 0.15); background: white; }
    .identify-box .actions { display: flex; gap: 0.75rem; margin-top: 0.75rem; flex-wrap: wrap; }
    .identify-box .actions button, .identify-box .actions label {
      padding: 0.7rem 1.8rem; border-radius: 50px; cursor: pointer;
      font-weight: 700; font-family: 'Nunito', sans-serif; font-size: 0.9rem;
      transition: all 0.3s ease; border: none;
    }
    .identify-box .actions button {
      background: linear-gradient(135deg, #f48fb1, #ce93d8); color: white;
      box-shadow: 0 4px 12px rgba(244, 143, 177, 0.3);
    }
    .identify-box .actions button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(244, 143, 177, 0.4); }
    .identify-box .actions label {
      background: rgba(255,255,255,0.8); border: 2px solid rgba(244, 143, 177, 0.25); color: #7a4a6a;
    }
    .identify-box .actions label:hover { background: white; border-color: #f48fb1; transform: translateY(-2px); }
    .result-card {
      display: none; margin-top: 1.5rem;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(8px);
      border-radius: 20px; padding: 1.8rem;
      border: 2px solid rgba(244, 143, 177, 0.2); box-shadow: 0 8px 32px rgba(244, 143, 177, 0.1);
    }
    .result-card.visible { display: block; }
    .result-card h2 { font-size: 1.1rem; margin-bottom: 0.5rem; color: #c94f7c; font-family: 'Playfair Display', serif; font-style: italic; }
    .result-card .meta { color: #9a7a8a; font-size: 0.85rem; margin-bottom: 0.75rem; }
    .result-card .meta strong { color: #4a2c3a; }
    .result-card .desc { line-height: 1.7; margin-bottom: 1rem; color: #5a3c4a; }
    .result-card .trans { border-top: 2px dashed rgba(244, 143, 177, 0.3); padding-top: 1rem; }
    .result-card .trans h3 { font-size: 0.9rem; margin-bottom: 0.8rem; color: #ce93d8; font-weight: 800; }
    .result-card .trans .version { margin-bottom: 0.7rem; padding: 0.6rem 0.8rem; background: rgba(248, 187, 208, 0.1); border-radius: 10px; }
    .result-card .trans .version:last-child { margin-bottom: 0; }
    .result-card .trans .version .label { font-weight: 700; font-size: 0.8rem; color: #7a4a6a; }
    .result-card .trans .version .quote { font-style: italic; color: #6a4a5a; font-family: 'Playfair Display', serif; font-size: 0.95rem; }
    .no-match { display: none; margin-top: 1.5rem; padding: 1.2rem; background: rgba(255, 205, 210, 0.6); border: 2px solid #ef9a9a; border-radius: 16px; color: #b35a5a; text-align: center; font-weight: 600; }
    .no-match.visible { display: block; }
    .loading { text-align: center; padding: 2rem; color: #ce93d8; font-weight: 700; display: none; }
    .loading.visible { display: block; }
    .marker-count { font-size: 0.8rem; color: #9a7a8a; margin-top: 0.3rem; font-weight: 600; }
    #file-input { display: none; }

    .popup-site strong { color: #c94f7c; }
    .popup-site .popup-status { display: inline-block; padding: 0.1rem 0.5rem; border-radius: 50px; font-size: 0.7rem; font-weight: 700; margin-top: 0.3rem; }
    .popup-site .popup-status.ongoing { background: #c8e6c9; color: #2e7d32; }
    .popup-site .popup-status.completed { background: #e0e0e0; color: #616161; }

    @media (max-width: 600px) {
      header { flex-direction: column; text-align: center; padding: 1rem; }
      .timeline-labels { font-size: 0.6rem; }
      .filter-chip { font-size: 0.7rem; padding: 0.25rem 0.7rem; }
    }
  </style>
</head>
<body>

<header>
  <span class="heart">&#x1F497;</span>
  <h1>Excavatio</h1>
  <span>ancient world explorer &#x1F308;</span>
</header>

<nav>
  <button class="active" data-tab="map-tab">&#x1F5FA; excavation map</button>
  <button data-tab="text-tab">&#x1F4DC; text identifier</button>
</nav>

<div id="map-tab" class="tab-content active">
  <div class="container">
    <div class="map-section">

      <div class="timeline-bar">
        <div class="timeline-header">
          <span class="label">&#x1F4C5; excavation timeline</span>
          <span class="year-display" id="year-display">all years</span>
        </div>
        <div class="timeline-track" id="timeline-track">
          <div class="timeline-rail"></div>
          <div class="timeline-fill" id="timeline-fill"></div>
          <div class="timeline-handle" id="timeline-handle"></div>
        </div>
        <div class="timeline-labels">
          <span id="timeline-min">1700</span>
          <span id="timeline-max">2026</span>
        </div>
        <div class="timeline-filters">
          <button class="filter-chip active" data-filter="all">&#x1F30D; all</button>
          <button class="filter-chip" data-filter="ongoing">&#x1F7E2; ongoing</button>
          <button class="filter-chip" data-filter="completed">&#x26AA; completed</button>
          <button class="filter-chip" data-filter="ancient">&#x1F3F4;&#x200D;&#x26A7; ancient</button>
          <button class="filter-chip" data-filter="modern">&#x1F3D7;&#xFE0F; modern</button>
        </div>
      </div>

      <div id="map"></div>

      <div class="site-list" id="site-list"></div>

      <div class="site-panel" id="site-panel">
        <h3 id="panel-title"></h3>
        <div class="period" id="panel-period"></div>
        <p class="desc" id="panel-desc"></p>
        <div class="meta-row">
          <span class="pill" id="panel-status"></span>
          <span id="panel-years"></span>
        </div>
      </div>

      <div class="marker-count" id="marker-count"></div>
    </div>
  </div>
</div>

<div id="text-tab" class="tab-content">
  <div class="container">
    <div class="identify-box">
      <textarea id="text-input" placeholder="paste a passage from a classical text...&#10;&#10;arma virumque cano&#10;&#10;or:&#10;&#10;&#x1F3F3;&#xFE0F;&#x200D;&#x1F308; &#x1F9D6;&#x200D;&#x2640;&#xFE0F; &#x1F469;&#x200D;&#x1F469;&#x200D;&#x1F467;&#x200D;&#x1F466; &#x1F3F4;&#x200D;&#x26A7; &#x1F9D6;&#x200D;&#x2640;&#xFE0F; &#x1F9D6;&#x200D;&#x2642;&#xFE0F; &#x1F3C3;&#x200D;&#x2642;&#xFE0F; &#x1F9F3; &#x1F9F3; &#x2744;&#xFE0F;&#x200D;&#x2744;&#xFE0F; &#x2B50;&#xFE0F; &#x1F31F; &#x1F31F; &#x1F308; &#x2728;"></textarea>
      <div class="actions">
        <button id="identify-btn">&#x2728; identify</button>
        <label for="file-input">&#x1F4F7; upload image</label>
        <input type="file" id="file-input" accept="image/*">
      </div>
      <div class="loading" id="loading">identifying</div>
      <div class="no-match" id="no-match">&#x1F4AD; no match found — try a different passage!</div>
      <div class="result-card" id="result-card">
        <h2 id="result-title"></h2>
        <div class="meta">
          <span><strong>author:</strong> <span id="result-author"></span></span> &middot;
          <span><strong>work:</strong> <span id="result-work"></span></span> &middot;
          <span id="result-location"></span>
        </div>
        <p class="desc" id="result-desc"></p>
        <div class="trans">
          <h3>&#x1F30D; translations & editions</h3>
          <div id="result-trans"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  let allSites = [];
  let mapMarkers = {};
  let handlePos = 1;
  let currentFilter = 'all';
  let activeSiteId = null;
  const selectedMarkerIcon = L.divIcon({
    className: '',
    html: '<div style="width:18px;height:18px;background:linear-gradient(135deg,#f48fb1,#ce93d8);border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 4px rgba(244,143,177,0.4),0 2px 8px rgba(0,0,0,0.2);"></div>',
    iconSize: [18, 18],
    iconAnchor: [9, 9]
  });

  const map = L.map('map').setView([38.5, 15.5], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OSM</a>'
  }).addTo(map);

  function loadSites() {
    const params = new URLSearchParams();
    if (currentFilter === 'ongoing') params.set('status', 'ongoing');
    else if (currentFilter === 'completed') params.set('status', 'completed');
    else if (['ancient','modern'].includes(currentFilter)) params.set('era', currentFilter);
    fetch(`/api/excavations?${params}`)
      .then(r => r.json())
      .then(data => {
        allSites = data.sites;
        renderTimeline(data.yearMin, data.yearMax);
        renderSites();
      });
  }

  function renderTimeline(yearMin, yearMax) {
    document.getElementById('timeline-min').textContent = yearMin;
    document.getElementById('timeline-max').textContent = yearMax;
    const track = document.getElementById('timeline-track');
    const handle = document.getElementById('timeline-handle');
    const fill = document.getElementById('timeline-fill');

    function posToYear(frac) {
      return Math.round(yearMin + frac * (yearMax - yearMin));
    }

    function updateFromMouse(clientX) {
      const rect = track.getBoundingClientRect();
      let frac = (clientX - rect.left) / rect.width;
      frac = Math.max(0, Math.min(1, frac));
      handlePos = frac;
      handle.style.left = `${frac * 100}%`;
      fill.style.width = `${frac * 100}%`;
      const year = posToYear(frac);
      document.getElementById('year-display').textContent = year >= new Date().getFullYear() ? 'present' : year;
      filterByYear(year);
    }

    function onDrag(e) {
      e.preventDefault();
      const moveHandler = (ev) => {
        ev.preventDefault();
        updateFromMouse(ev.clientX);
      };
      const upHandler = () => {
        document.removeEventListener('mousemove', moveHandler);
        document.removeEventListener('mouseup', upHandler);
      };
      document.addEventListener('mousemove', moveHandler);
      document.addEventListener('mouseup', upHandler);
    }

    handle.addEventListener('mousedown', onDrag);
    track.addEventListener('mousedown', (e) => {
      if (e.target === handle) return;
      updateFromMouse(e.clientX);
    });

    updateFromMouse(track.getBoundingClientRect().left + track.getBoundingClientRect().width);
  }

  function filterByYear(year) {
    const siteEls = document.querySelectorAll('.site-chip');
    const hidden = [];
    siteEls.forEach(el => {
      const sy = parseFloat(el.dataset.start);
      const ey = el.dataset.end ? parseFloat(el.dataset.end) : 9999;
      const visible = sy <= year;
      el.style.display = visible ? '' : 'none';
      if (!visible) hidden.push(el.dataset.id);
    });
    Object.entries(mapMarkers).forEach(([id, m]) => {
      if (hidden.includes(id)) {
        map.removeLayer(m.layer);
      } else if (!map.hasLayer(m.layer)) {
        m.layer.addTo(map);
      }
    });
  }

  function renderSites() {
    const list = document.getElementById('site-list');
    list.innerHTML = '';
    Object.values(mapMarkers).forEach(m => map.removeLayer(m.layer));
    mapMarkers = {};

    allSites.forEach((site, i) => {
      const chip = document.createElement('div');
      chip.className = 'site-chip';
      chip.dataset.id = site.id;
      chip.dataset.start = site.startYear;
      chip.dataset.end = site.endYear || 9999;
      chip.innerHTML = `<span class="dot ${site.ongoing ? 'ongoing' : 'completed'}"></span>${site.title}`;
      chip.addEventListener('click', () => selectSite(site.id));
      list.appendChild(chip);

      setTimeout(() => {
        const marker = L.circleMarker([site.lat, site.lng], {
          radius: 8,
          fillColor: site.ongoing ? '#66bb6a' : '#ce93d8',
          color: '#fff',
          weight: 2.5,
          fillOpacity: 0.9
        }).addTo(map);

        marker.bindPopup(`
          <div class="popup-site">
            <strong>${site.title}</strong><br>
            <span style="font-size:0.8rem;color:#9a7a8a;">${site.period}</span><br>
            <span class="popup-status ${site.ongoing ? 'ongoing' : 'completed'}">${site.ongoing ? 'ongoing' : 'completed'}</span><br>
            <span style="font-size:0.75rem;color:#aaa;">excavation: ${site.startYear}${site.endYear ? '–'+site.endYear : '–present'}</span>
          </div>
        `);

        marker.on('click', () => selectSite(site.id));
        mapMarkers[site.id] = { layer: marker, data: site };
      }, i * 30);
    });

    document.getElementById('marker-count').textContent = `${allSites.length} sites`;
  }

  function selectSite(id) {
    activeSiteId = id;
    document.querySelectorAll('.site-chip').forEach(el => {
      el.classList.toggle('active', el.dataset.id === id);
    });

    const site = mapMarkers[id]?.data;
    if (!site) return;

    const panel = document.getElementById('site-panel');
    document.getElementById('panel-title').textContent = site.title;
    document.getElementById('panel-period').textContent = `${site.period}`;
    document.getElementById('panel-desc').textContent = site.description;
    document.getElementById('panel-status').textContent = site.ongoing ? 'ongoing' : 'completed';
    document.getElementById('panel-status').className = `pill ${site.ongoing ? 'ongoing' : 'completed'}`;
    const years = site.endYear ? `${site.startYear}–${site.endYear}` : `${site.startYear}–present`;
    document.getElementById('panel-years').textContent = `excavation: ${years}`;
    panel.classList.add('visible');

    map.setView([site.lat, site.lng], 6, { animate: true });

    Object.entries(mapMarkers).forEach(([mid, m]) => {
      m.layer.setStyle({
        radius: mid === id ? 12 : 8,
        fillOpacity: mid === id ? 1 : 0.9,
        fillColor: mid === id ? '#f48fb1' : (m.data.ongoing ? '#66bb6a' : '#ce93d8')
      });
    });
  }

  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentFilter = chip.dataset.filter;
      document.getElementById('site-panel').classList.remove('visible');
      loadSites();
    });
  });

  document.querySelectorAll('nav button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).classList.add('active');
      if (btn.dataset.tab === 'map-tab') setTimeout(() => map.invalidateSize(), 100);
    });
  });

  loadSites();

  // ---- Text Identifier ----
  const identifyBtn = document.getElementById('identify-btn');
  const textInput = document.getElementById('text-input');
  const loading = document.getElementById('loading');
  const noMatch = document.getElementById('no-match');
  const resultCard = document.getElementById('result-card');

  function identifyText(text) {
    if (!text.trim()) return;
    loading.classList.add('visible');
    noMatch.classList.remove('visible');
    resultCard.classList.remove('visible');
    fetch('/api/identify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    })
      .then(r => r.json())
      .then(data => {
        loading.classList.remove('visible');
        if (!data.matched) { noMatch.classList.add('visible'); return; }
        document.getElementById('result-title').textContent = `"${data.text}"`;
        document.getElementById('result-author').textContent = data.author;
        document.getElementById('result-work').textContent = data.work;
        const loc = [];
        if (data.book) loc.push(`book ${data.book}`);
        if (data.section) loc.push(`section ${data.section}`);
        if (data.line) loc.push(`line ${data.line}`);
        document.getElementById('result-location').innerHTML = `<strong>location:</strong> ${loc.join(', ') || 'n/a'}`;
        document.getElementById('result-desc').textContent = data.description;
        const transDiv = document.getElementById('result-trans');
        transDiv.innerHTML = '';
        if (data.translations) {
          Object.entries(data.translations).forEach(([edition, quote]) => {
            const v = document.createElement('div');
            v.className = 'version';
            v.innerHTML = `<span class="label">${edition}</span><br><span class="quote">"${quote}"</span>`;
            transDiv.appendChild(v);
          });
        }
        resultCard.classList.add('visible');
      })
      .catch(() => { loading.classList.remove('visible'); noMatch.classList.add('visible'); });
  }

  identifyBtn.addEventListener('click', () => identifyText(textInput.value));
  textInput.addEventListener('keydown', e => { if (e.key === 'Enter' && e.ctrlKey) identifyText(textInput.value); });

  document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const imgData = ev.target.result;
      loading.classList.add('visible');
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      script.onload = function() {
        Tesseract.recognize(imgData, 'eng+lat+grc', {
          logger: m => { if (m.status === 'recognizing text') loading.textContent = `ocr: ${Math.round(m.progress * 100)}%`; }
        }).then(({ data: { text } }) => {
          loading.textContent = 'identifying';
          loading.classList.remove('visible');
          textInput.value = text;
          identifyText(text);
        }).catch(() => {
          loading.textContent = 'identifying'; loading.classList.remove('visible'); noMatch.classList.add('visible');
        });
      };
      script.onerror = function() { loading.classList.remove('visible'); alert('Failed to load OCR engine.'); };
      document.head.appendChild(script);
    };
    reader.readAsDataURL(file);
  });
</script>
</body>
</html>
