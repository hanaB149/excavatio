<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excavatio — Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital@0;1&display=swap" rel="stylesheet">
  <style>
    @keyframes floatOuter {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-4px) rotate(2deg); }
      75% { transform: translateY(-2px) rotate(-1deg); }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.08); }
      60% { transform: scale(1); }
    }
    @keyframes shimmerPastel {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes breathePink {
      0%, 100% { box-shadow: 0 0 20px rgba(244, 143, 177, 0.15); }
      50% { box-shadow: 0 0 50px rgba(244, 143, 177, 0.3); }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #fef6f8 0%, #fce4ec 30%, #fef0f6 60%, #fde8ef 100%);
      background-size: 400% 400%;
      animation: shimmerPastel 12s ease infinite;
      color: #5c3349;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image:
        radial-gradient(circle at 15% 30%, rgba(244,143,177,0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 20%, rgba(206,147,216,0.06) 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(248,187,208,0.07) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .floating-heart {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(244,143,177,0.35);
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      animation: floatOuter 5s ease-in-out infinite;
    }

    .welcome-card {
      position: relative;
      z-index: 1;
      max-width: 440px;
      width: 100%;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      border: 2px solid rgba(244, 143, 177, 0.22);
      box-shadow: 0 12px 50px rgba(244, 143, 177, 0.15);
      padding: 2.5rem 2.2rem;
      animation: fadeSlideUp 0.5s ease;
    }

    .welcome-card .heart-icon {
      display: flex;
      justify-content: center;
      margin-bottom: 0.8rem;
      animation: heartbeat 2.5s ease-in-out infinite;
    }
    .welcome-card .heart-icon svg {
      width: 36px;
      height: 36px;
      fill: none;
      stroke: #f48fb1;
      stroke-width: 2.2;
    }

    .welcome-card h1 {
      font-size: 1.8rem;
      font-weight: 800;
      text-align: center;
      color: #c94f7c;
      letter-spacing: 0.02em;
      margin-bottom: 0.3rem;
    }
    .welcome-card .tagline {
      text-align: center;
      font-size: 0.88rem;
      color: #9a7a8a;
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    .welcome-card .desc {
      text-align: center;
      font-size: 0.85rem;
      color: #7a5a6a;
      line-height: 1.6;
      margin-bottom: 1.8rem;
      font-family: 'Source Serif 4', serif;
      font-style: italic;
    }

    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      background: rgba(244,143,177,0.08);
      border-radius: 12px;
      padding: 0.3rem;
    }
    .tabs button {
      flex: 1;
      padding: 0.65rem;
      border: none;
      background: transparent;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      color: #9a7a8a;
      border-radius: 9px;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .tabs button.active {
      background: white;
      color: #c94f7c;
      box-shadow: 0 2px 8px rgba(244,143,177,0.12);
    }

    .form-panel { display: none; }
    .form-panel.active { display: block; animation: fadeSlideUp 0.3s ease; }

    .field {
      margin-bottom: 1rem;
    }
    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #7a4a6a;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .field input {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 2px solid rgba(244, 143, 177, 0.2);
      border-radius: 12px;
      font-size: 0.92rem;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      color: #4a2c3a;
      background: rgba(255,255,255,0.8);
      transition: all 0.25s ease;
    }
    .field input::placeholder { color: #c9a8b8; font-weight: 400; }
    .field input:focus {
      outline: none;
      border-color: #f48fb1;
      background: white;
      box-shadow: 0 0 0 4px rgba(244, 143, 177, 0.1);
    }

    .submit-btn {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f48fb1, #ce93d8);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.25s ease;
      margin-top: 0.3rem;
      box-shadow: 0 4px 16px rgba(244,143,177,0.25);
    }
    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(244,143,177,0.35);
    }
    .submit-btn:active { transform: translateY(0); }

    .error-msg {
      background: rgba(229, 115, 115, 0.1);
      border: 1px solid rgba(229, 115, 115, 0.3);
      border-radius: 10px;
      padding: 0.6rem 0.9rem;
      font-size: 0.82rem;
      color: #c62828;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .form-hint {
      text-align: center;
      font-size: 0.78rem;
      color: #b08a9a;
      margin-top: 1.2rem;
      line-height: 1.5;
    }
    .form-hint a {
      color: #c94f7c;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .form-hint a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .welcome-card { padding: 2rem 1.5rem; border-radius: 18px; }
      .welcome-card h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="floating-heart" style="top: 15%; left: 10%;"></div>
<div class="floating-heart" style="top: 70%; left: 85%; animation-delay: 1.5s;"></div>
<div class="floating-heart" style="top: 40%; left: 92%; animation-delay: 3s;"></div>

<div class="welcome-card">
  <div class="heart-icon">
    <svg viewBox="0 0 24 24">
      <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
    </svg>
  </div>
  <h1>Excavatio</h1>
  <div class="tagline">ancient world explorer</div>
  <p class="desc">explore excavation sites, trace the journeys of ancient figures, and discover how historical events echo through literature and artefacts.</p>

  {% if error %}
  <div class="error-msg">{{ error }}</div>
  {% endif %}

  <div class="tabs">
    <button id="tab-login" class="{{ 'active' if mode != 'signup' else '' }}" onclick="switchTab('login')">sign in</button>
    <button id="tab-signup" class="{{ 'active' if mode == 'signup' else '' }}" onclick="switchTab('signup')">create account</button>
  </div>

  <div id="panel-login" class="form-panel {{ 'active' if mode != 'signup' else '' }}">
    <form method="POST" action="/login">
      <div class="field">
        <label>username</label>
        <input type="text" name="username" placeholder="your username" autocomplete="username" required>
      </div>
      <div class="field">
        <label>password</label>
        <input type="password" name="password" placeholder="your password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="submit-btn">sign in</button>
    </form>
    <p class="form-hint">don't have an account? <a onclick="switchTab('signup')">create one</a></p>
  </div>

  <div id="panel-signup" class="form-panel {{ 'active' if mode == 'signup' else '' }}">
    <form method="POST" action="/signup">
      <div class="field">
        <label>username</label>
        <input type="text" name="username" placeholder="choose a username (min 3 chars)" autocomplete="username" value="{{ username or '' }}" required>
      </div>
      <div class="field">
        <label>email</label>
        <input type="email" name="email" placeholder="your email" autocomplete="email" value="{{ email or '' }}" required>
      </div>
      <div class="field">
        <label>password</label>
        <input type="password" name="password" placeholder="choose a password (min 6 chars)" autocomplete="new-password" required>
      </div>
      <button type="submit" class="submit-btn">create account</button>
    </form>
    <p class="form-hint">already have an account? <a onclick="switchTab('login')">sign in</a></p>
  </div>
</div>

<script>
  function switchTab(tab) {
    document.getElementById('tab-login').classList.toggle('active', tab === 'login');
    document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
    document.getElementById('panel-login').classList.toggle('active', tab === 'login');
    document.getElementById('panel-signup').classList.toggle('active', tab === 'signup');
  }
</script>
</body>
</html>
